name: Update Fallback Directory

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 */2 * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.0"

      - name: Generate Go source
        run: |
          go generate ./tools/fallback

      - name: Commit changes
        run: |
          git config user.name "fallback dirs bot"
          git config user.email "github-actions@github.com"

          git config pull.rebase true

          git add internal/shared/
          git diff --cached --quiet || git commit -m "chore: update fallback directory"
          git pull
          git push
